name: Release

# 触发方式：
#   ① 推送 v* 标签（推荐）—— 一条命令全自动发版
#   ② 手动发布 Release
#   ③ Actions 页面手动触发
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          binary=phanthywork2api
          if [ "$GOOS" = "windows" ]; then
            binary="${binary}.exe"
          fi
          go build -ldflags="-s -w" -o "$binary" ./cmd/server
          tarball="phanthywork2api-${GOOS}-${GOARCH}.tar.gz"
          tar czf "$tarball" "$binary"
          echo "tarball=$tarball" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          if [ -f CHANGELOG.md ]; then
            python3 - "${GITHUB_REF_NAME}" <<'PY'
          import sys
          tag = sys.argv[1]
          ver = tag[1:] if tag[:1] in ('v',) else tag
          lines = open('CHANGELOG.md', encoding='utf-8').read().splitlines()
          out, capture, found = [], False, False
          for line in lines:
              if line.startswith('## ['):
                  if capture:
                      break
                  if line[4:].split(']')[0].strip() == ver:
                      capture, found = True, True
                  continue
              if capture:
                  out.append(line)
          body = '\n'.join(out).strip()
          open('RELEASE_NOTES.md', 'w', encoding='utf-8').write((body or ('版本 ' + ver)) + '\n')
          print('found=%s chars=%d' % (found, len(body)))
          PY
          else
            printf '__NO_CHANGELOG__\n' > RELEASE_NOTES.md
          fi

      - name: Remove placeholder if CHANGELOG missing
        run: |
          if grep -q '__NO_CHANGELOG__' RELEASE_NOTES.md 2>/dev/null; then
            rm -f RELEASE_NOTES.md
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.tarball }}
          # 正文优先从 CHANGELOG.md 读取；没有则回退到自动生成的提交说明
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
